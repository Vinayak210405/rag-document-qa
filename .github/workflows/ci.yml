name: tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --extra eval --extra llamaindex   # no PyTorch, no model downloads
      - run: uv run pytest -q    # offline: no API keys, no network model downloads
