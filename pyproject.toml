[project]
name = "rag-document-qa"
version = "0.1.0"
description = "Evaluation-driven document QA with retrieval-augmented generation"
readme = "README.md"
requires-python = ">=3.11"

# Core = everything the baseline application (Milestone 1+) runs, so a plain
# `uv sync` gives a working system. Genuinely heavy or optional pieces live in
# extras: PyTorch embeddings, BM25, Ragas, and the LlamaIndex comparison.
dependencies = [
    "numpy>=2.0,<3",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.4,<3",
    "httpx>=0.27,<1",                      # LLM client, frontend client, API tests
    "pypdf>=5,<7",                         # PDF parsing
    "python-docx>=1.1,<2",                 # DOCX parsing
    "chromadb>=1.0,<2",                    # persistent vector storage
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.9",             # file uploads
    "streamlit>=1.40,<2",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3,<7"]   # real embeddings + CrossEncoder (M4); pulls in PyTorch
bm25       = ["rank-bm25>=0.2.2,<0.3"]         # M3
eval       = ["ragas>=0.4,<0.5", "langchain-community>=0.4,<0.4.2", "openai>=1.0"]   # M8
llamaindex = [                                 # M10: framework comparison over the same Chroma index
    "llama-index-core>=0.14,<0.15",
    "llama-index-vector-stores-chroma>=0.6,<0.7",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Default runs are offline: tests needing model weights or an API key are
# opt-in via: pytest -m "requires_model or requires_api"
# (Markers are declared now but first exercised in Milestone 1.)
addopts = "-ra --strict-markers -m 'not requires_model and not requires_api'"
markers = [
    "requires_model: needs downloaded model weights (network on first run)",
    "requires_api: needs a live LLM endpoint or API key",
]
